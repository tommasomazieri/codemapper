[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemapper"
version = "2.0.0"
description = "Unified codebase intelligence tool: Graphify graph + codemapper diagnostics, served via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
    "graphifyy>=0.8",
    "openai>=1.0",
    "networkx>=3.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "watchdog>=4",
]
# HTML diagnostics (analysis/html.py). JS/TS diagnostics use the external
# `fallow` binary (npm i -D fallow / cargo install fallow-cli), not a pip dep.
multilang = [
    "tree-sitter>=0.21",
    "tree-sitter-html>=0.20",
]

[project.scripts]
codemapper2 = "codemapper.cli:app"
