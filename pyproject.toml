[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemapper"
version = "0.1.0"
description = "Middleware tool that maps a Python codebase for LLM agent consumption"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # for FastAPI test client
    "watchdog>=4",   # optional live index refresh
]

[project.scripts]
codemapper = "codemapper.cli:app"
